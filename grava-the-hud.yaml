enabled: true
custom_logo:
  - name: hb-wordmark.svg
    size: 9541
    type: image/svg+xml
custom_logo_mobile:
  - name: hb-mark.svg
    size: 806
    type: image/svg+xml
custom_favicon:
  - name: hb-favicon.png
    size: 7157
    type: image/png
header-fixed: true
header-animated: true
header-transparent: false
header-dark: false
header-light: false
sticky-footer: true
layout-fluid: false
theme-mode: auto
accent-color: '#18A98A'
blog-page: '/blog'
code_highlighting: true
fontawesome:
  enabled: true
  # true = serve css/fontawesome/all.min.css from this theme: a subset built 2026-11-27
  # with only the 29 icons used here (4 kB of woff2 vs 178 kB from the cdnjs CDN,
  # no third-party render-blocking request). Set back to false to use cdnjs again.
  local: true
